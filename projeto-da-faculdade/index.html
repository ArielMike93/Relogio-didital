        <div>
             <span id="horas">00 : 00</span>
             <span class="tempo"> Horas.</span>
        </div>

        <div>
             <span id="minutos">00 : 00</span>
             <span class="tempo"> Minutos.</span>
        </div>

        <div>
             <span id="segundos">00 : 00</span>
             <span class="tempo"> Segundos.</span>
        </div>


        <script>
            const horas = document.getElementById('horas');
            const minutos = document.getElementById('minutos');
            const segundos = document.getElementById('segundos');

            function atualizarRelogio() {
                const agora = new Date();
                const h = String(agora.getHours()).padStart(2, '0');
                const m = String(agora.getMinutes()).padStart(2, '0');
                const s = String(agora.getSeconds()).padStart(2, '0');

                

                horas.textContent = h;
                minutos.textContent = m;
                segundos.textContent = s;
            }

             // Atualiza a cada segundo (1000ms)
            setInterval(atualizarRelogio, 1000);

        </script>
    </div>

     <div class="card">
    <div class="location" id="location">Detectando local...</div>
    
    <div class="temp-container">
      <span class="temperature" id="temp">--</span>
      <span class="unit">°C</span>
    </div>
    
    <div class="status" id="status">Buscando dados...</div>

    <div class="update-badge">
      <span class="dot"></span>
      Atualização Automática (<span id="timer">5</span>s)
    </div>
  </div>

  <!-- Lógica JavaScript -->
  <script>
    const tempElement = document.getElementById('temp');
    const statusElement = document.getElementById('status');
    const locationElement = document.getElementById('location');
    const timerElement = document.getElementById('timer');

    let countdown = 5;
    let userLat = null;
    let userLon = null;

    // 1. Busca dados reais de temperatura usando a API da Open-Meteo
    async function fetchTemperature(lat, lon) {
      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const data = await response.json();
        
        const temp = Math.round(data.current_weather.temperature);
        tempElement.textContent = temp;

        // Define mensagem conforme a temperatura
        if (temp >= 30) {
          statusElement.textContent = "Dia Ensolarado e Quente ☀️";
        } else if (temp >= 20) {
          statusElement.textContent = "Clima Agradável 🌤️";
        } else {
          statusElement.textContent = "Clima Frio ❄️";
        }
      } catch (error) {
        statusElement.textContent = "Erro ao carregar dados";
      }
    }

    // 2. Simulação de atualização (se geolocalização não for permitida)
    function simulateTemperature() {
      // Gera temperatura aleatória entre 21°C e 27°C
      const simulatedTemp = (20 + Math.random() * 8).toFixed(1);
      tempElement.textContent = simulatedTemp;
      statusElement.textContent = "Modo Simulação (Demo) 🔄";
      locationElement.textContent = "Cidade Demo";
    }

    // 3. Atualiza os dados conforme disponibilidade
    function updateData() {
      if (userLat && userLon) {
        fetchTemperature(userLat, userLon);
      } else {
        simulateTemperature();
      }
    }

    // 4. Temporizador e Atualização Automática
    setInterval(() => {
      countdown--;
      timerElement.textContent = countdown;

      if (countdown === 0) {
        updateData();
        countdown = 5; // Reseta a contagem
      }
    }, 1000);

    // 5. Inicialização: Obtém localização do usuário
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          userLat = position.coords.latitude;
          userLon = position.coords.longitude;
          locationElement.textContent = "Sua Localização";
          updateData();
        },
        () => {
          // Caso o usuário negue a permissão de localização
          locationElement.textContent = "Localização Não Permitida";
          updateData();
        }
      );
    } else {
      updateData();
    }
  </script>
